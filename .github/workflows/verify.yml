name: Verify system
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            BE/package-lock.json
            FE/package-lock.json
      - run: npm ci
        working-directory: BE
      - run: npm ci
        working-directory: FE
      - run: npm run build && npm run test:hardening && npm run test:captcha
        working-directory: BE
      - run: npm run test:business
        working-directory: BE
      - run: npm run verify
        working-directory: FE
      - run: npx playwright install --with-deps chromium
        working-directory: FE
      - name: Test critical frontend flows
        run: npm run test:ui:smoke
        working-directory: FE
      - name: Test additional frontend business scenarios
        run: npm run test:core:ui
        working-directory: FE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-playwright-report
          path: FE/playwright-report/
          if-no-files-found: ignore
      - name: Test frontend Turnstile flows
        run: npm run test:captcha
        working-directory: FE
      - run: npm run test:qa:isolation -- --live
        working-directory: BE
