name: Verify system
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            BE/package-lock.json
            FE/package-lock.json
      - run: npm ci
        working-directory: BE
      - run: npm ci
        working-directory: FE
      - run: npm run build && npm run test:hardening && npm run test:captcha
        working-directory: BE
      - run: npm run verify
        working-directory: FE
      - run: npx playwright install --with-deps chromium
        working-directory: FE
      - run: npx playwright test refund-confirmation.spec.ts membership-quick-actions.spec.ts manager-scope.spec.ts --workers=2
        working-directory: FE
      - run: npm run test:qa:isolation -- --live
        working-directory: BE
